<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Audit Log - Faiz al-Mawaid al-Burhaniyah Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/site.css?v=20261007a" rel="stylesheet">
</head>
<body>
  <div id="ckNavbar"></div>

  <main class="container my-4">
    <div class="ck-page-header">
      <h1 class="mb-1"><i class="bi bi-clock-history me-2"></i>Audit Log</h1>
      <p class="ck-muted mb-0">A trail of who did what, across the app.</p>
    </div>

    <div class="card mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-end">
          <div class="col-6 col-md-3">
            <label class="form-label mb-1" for="entityType">Entity type</label>
            <select class="form-select" id="entityType">
              <option value="">All</option>
              <option value="Family">Family</option>
              <option value="ThaaliCancellation">ThaaliCancellation</option>
              <option value="MealPlan">MealPlan</option>
              <option value="NonServingDay">NonServingDay</option>
              <option value="AppSettings">AppSettings</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label mb-1" for="entityId">Entity ID</label>
            <input type="number" class="form-control" id="entityId" min="1" placeholder="Any">
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label mb-1" for="fromDate">From</label>
            <input type="date" class="form-control" id="fromDate">
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label mb-1" for="toDate">To</label>
            <input type="date" class="form-control" id="toDate">
          </div>
          <div class="col-12 col-md-3 d-flex gap-2">
            <button class="btn btn-primary flex-fill" id="filterBtn"><i class="bi bi-search me-1"></i>Filter</button>
            <button class="btn btn-outline-secondary" id="clearBtn" title="Clear filters"><i class="bi bi-x-lg"></i></button>
          </div>
        </div>
      </div>
    </div>

    <div id="loadingBox" class="ck-loading"><div class="spinner-border text-primary"></div></div>
    <div id="emptyBox" class="ck-empty-state d-none"><i class="bi bi-inboxes"></i>No matching audit entries.</div>

    <div class="table-responsive d-none" id="tableWrap">
      <table class="table align-middle bg-white">
        <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Entity</th><th></th></tr></thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
  </main>

  <footer class="ck-footer text-center"><div class="container"><a href="https://www.thedawoodibohras.com/faiz-al-mawaid-al-burhaniyah/" target="_blank" rel="noopener" class="ck-footer-link">Faiz al-Mawaid al-Burhaniyah</a> Community Kitchen</div></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site.js?v=20261007a"></script>
  <script>
    $(function () {
      var session = CK.session.requireSuperAdmin();
      if (!session) { return; }
      CK.nav.render("admin", "reports");

      var usersById = {};

      function load() {
        $("#loadingBox").show();
        $("#tableWrap").addClass("d-none");
        $("#emptyBox").addClass("d-none");

        var params = [];
        var entityType = $("#entityType").val();
        var entityId = $("#entityId").val();
        var from = $("#fromDate").val();
        var to = $("#toDate").val();
        if (entityType) { params.push("entityType=" + encodeURIComponent(entityType)); }
        if (entityId) { params.push("entityId=" + encodeURIComponent(entityId)); }
        if (from) { params.push("from=" + from); }
        if (to) { params.push("to=" + to); }
        var url = "/api/auditlogs" + (params.length ? ("?" + params.join("&")) : "");

        $.when(
          CK.api.get("/api/users"),
          CK.api.get(url)
        ).done(function (usersResp, logsResp) {
          usersById = {};
          $.each(usersResp[0] || [], function (i, u) { usersById[u.id] = u; });
          render(logsResp[0] || []);
        }).fail(function (xhr) {
          $("#loadingBox").hide();
          CK.toast(CK.api.errorMessage(xhr, "Could not load the audit log."), "danger");
        });
      }

      function render(logs) {
        $("#loadingBox").hide();
        var $body = $("#logBody").empty();
        if (logs.length === 0) {
          $("#emptyBox").removeClass("d-none");
          return;
        }
        $("#tableWrap").removeClass("d-none");
        logs.sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; });

        $.each(logs, function (i, log) {
          var user = log.userId ? usersById[log.userId] : null;
          var rowId = "meta-" + log.id;
          var row =
            '<tr>' +
              '<td class="ck-small">' + CK.fmt.dateTime(log.createdAt) + '</td>' +
              '<td>' + (user ? CK.esc(user.fullName) : '<span class="ck-muted">System</span>') + '</td>' +
              '<td>' + CK.esc(log.action) + '</td>' +
              '<td><span class="ck-muted">' + CK.esc(log.entityType) + (log.entityId ? (' #' + log.entityId) : '') + '</span></td>' +
              '<td class="text-end">' + (log.metadataJson ? '<button class="btn btn-sm btn-link p-0 toggle-meta-btn" data-target="' + rowId + '">Details</button>' : '') + '</td>' +
            '</tr>' +
            (log.metadataJson ? ('<tr class="d-none" id="' + rowId + '"><td colspan="5"><pre class="ck-small bg-light p-2 rounded mb-0">' + CK.esc(formatJson(log.metadataJson)) + '</pre></td></tr>') : '');
          $body.append(row);
        });
      }

      function formatJson(raw) {
        try { return JSON.stringify(JSON.parse(raw), null, 2); } catch (e) { return raw; }
      }

      $(document).on("click", ".toggle-meta-btn", function () {
        $("#" + $(this).data("target")).toggleClass("d-none");
      });

      $("#filterBtn").on("click", load);
      $("#clearBtn").on("click", function () {
        $("#entityType").val("");
        $("#entityId, #fromDate, #toDate").val("");
        load();
      });

      load();
    });
  </script>
</body>
</html>
