<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Admin Portal - Faiz al-Mawaid al-Burhaniyah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/site.css?v=20261002d" rel="stylesheet">
</head>
<body>
  <div id="ckNavbar"></div>

  <main class="container" style="max-width:560px;">
    <div class="ck-page-header text-center">
      <div class="ck-eyebrow">Kitchen Admin</div>
      <h1><i class="bi bi-shield-check me-2"></i>Admin Portal</h1>
      <p class="ck-muted">Sign in with your admin email and password.</p>
    </div>

    <div class="card ck-card-elevated mb-4">
      <div class="card-body p-4 p-md-5">
        <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-4">
            <label for="email" class="form-label">Admin email address</label>
            <input type="email" class="form-control form-control-lg" id="email" required autofocus placeholder="admin@example.com">
            <div class="invalid-feedback">Please enter your email address.</div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg" id="password" required placeholder="Your password">
            <div class="invalid-feedback">Please enter your password.</div>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-accent btn-lg" id="submitBtn">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="text-center mb-5">
      <button class="btn btn-link" type="button" data-bs-toggle="collapse" data-bs-target="#firstAdminCollapse">
        <i class="bi bi-person-plus me-1"></i> Setting this up for the first time? Create an Admin account
      </button>
      <div class="collapse mt-3" id="firstAdminCollapse">
        <div class="card">
          <div class="card-body p-4 text-start">
            <div id="createAlert" class="alert alert-danger d-none"></div>
            <div id="createSuccess" class="alert alert-success d-none"></div>
            <form id="createAdminForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="newFullName">Full name</label>
                <input type="text" class="form-control" id="newFullName" required maxlength="255">
              </div>
              <div class="mb-3">
                <label class="form-label" for="newEmail">Email</label>
                <input type="email" class="form-control" id="newEmail" required maxlength="255">
              </div>
              <div class="mb-3">
                <label class="form-label" for="newPhone">Phone <span class="ck-muted fw-normal">(optional)</span></label>
                <input type="tel" class="form-control" id="newPhone" maxlength="30">
              </div>
              <div class="mb-3">
                <label class="form-label" for="newPassword">Password</label>
                <input type="password" class="form-control" id="newPassword" required minlength="8" maxlength="255">
                <div class="form-text">At least 8 characters. You'll use this to sign in from now on.</div>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary" id="createBtn"><i class="bi bi-check2 me-1"></i>Create Admin Account</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="ck-footer text-center">
    <div class="container"><a href="https://www.thedawoodibohras.com/faiz-al-mawaid-al-burhaniyah/" target="_blank" rel="noopener" class="ck-footer-link">Faiz al-Mawaid al-Burhaniyah</a> Community Kitchen</div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site.js?v=20261002d"></script>
  <script>
    $(function () {
      CK.nav.render("guest", null);

      var existing = CK.session.getAdmin();
      if (existing && existing.userId && existing.accessToken) {
        window.location.replace("dashboard.html");
        return;
      }

      function signIn(resp) {
        CK.session.setAdmin(resp);
        window.location.href = "dashboard.html";
      }

      $("#loginForm").on("submit", function (e) {
        e.preventDefault();
        $("#formAlert").addClass("d-none");
        var form = this;
        if (!form.checkValidity()) { $(form).addClass("was-validated"); return; }

        var email = $("#email").val().trim();
        var password = $("#password").val();
        var $btn = $("#submitBtn").prop("disabled", true).html('<span class="spinner-border spinner-border-sm me-1"></span>Signing in&hellip;');

        CK.auth.login(email, password).done(function (resp) {
          if (resp.roleName !== "Admin") {
            $("#formAlert").text("This account isn't an Admin account.").removeClass("d-none");
            resetBtn();
            return;
          }
          signIn(resp);
        }).fail(function (xhr) {
          $("#formAlert").text(CK.api.errorMessage(xhr, "Could not sign you in. If this is your first time, create an Admin account below.")).removeClass("d-none");
          resetBtn();
        });

        function resetBtn() {
          $btn.prop("disabled", false).html('<i class="bi bi-box-arrow-in-right me-1"></i> Sign In');
        }
      });

      $("#createAdminForm").on("submit", function (e) {
        e.preventDefault();
        $("#createAlert").addClass("d-none");
        $("#createSuccess").addClass("d-none");
        var form = this;
        if (!form.checkValidity()) { $(form).addClass("was-validated"); return; }

        var payload = {
          fullName: $("#newFullName").val().trim(),
          email: $("#newEmail").val().trim(),
          phone: $("#newPhone").val().trim() || null,
          password: $("#newPassword").val()
        };
        var $btn = $("#createBtn").prop("disabled", true).html('<span class="spinner-border spinner-border-sm me-1"></span>Creating&hellip;');

        CK.auth.bootstrapAdmin(payload).done(function (resp) {
          $("#createSuccess").text("Admin account created! Signing you in…").removeClass("d-none");
          setTimeout(function () { signIn(resp); }, 600);
        }).fail(function (xhr) {
          $("#createAlert").text(CK.api.errorMessage(xhr, "Could not create the admin account. If an Admin account already exists, sign in above instead.")).removeClass("d-none");
          $btn.prop("disabled", false).html('<i class="bi bi-check2 me-1"></i>Create Admin Account');
        });
      });
    });
  </script>
</body>
</html>
