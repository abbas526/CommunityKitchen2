<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>App Settings - Faiz al-Mawaid al-Burhaniyah Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/site.css?v=20261007a" rel="stylesheet">
</head>
<body>
  <div id="ckNavbar"></div>

  <main class="container my-4" style="max-width:640px;">
    <div class="ck-page-header">
      <h1 class="mb-1"><i class="bi bi-gear-fill me-2"></i>App Settings</h1>
      <p class="ck-muted mb-0">Controls that apply kitchen-wide.</p>
    </div>

    <div class="card ck-card-elevated">
      <div class="card-body p-4 p-md-5">
        <div id="loadingBox" class="ck-loading"><div class="spinner-border text-primary"></div></div>

        <form id="settingsForm" class="d-none" novalidate>
          <div id="formAlert" class="alert alert-danger d-none"></div>

          <h5 class="mb-2"><i class="bi bi-eye me-2"></i>Meal Visibility Window</h5>
          <p class="ck-muted">How many days of upcoming meals Family Members can see on their dashboard (today counts as day 1).</p>

          <div class="mb-2">
            <label class="form-label" for="mealVisibilityDays">Days ahead to show</label>
            <input type="number" class="form-control" id="mealVisibilityDays" min="1" max="60" required style="max-width:180px;">
            <div class="invalid-feedback">Please enter at least 1 day.</div>
          </div>
          <p class="ck-small ck-muted" id="lastUpdatedNote"></p>

          <div class="d-grid mt-3">
            <button type="submit" class="btn btn-primary" id="saveBtn"><i class="bi bi-check2 me-1"></i>Save Settings</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="ck-footer text-center"><div class="container"><a href="https://www.thedawoodibohras.com/faiz-al-mawaid-al-burhaniyah/" target="_blank" rel="noopener" class="ck-footer-link">Faiz al-Mawaid al-Burhaniyah</a> Community Kitchen</div></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site.js?v=20261007a"></script>
  <script>
    $(function () {
      var session = CK.session.requireSuperAdmin();
      if (!session) { return; }
      CK.nav.render("admin", "kitchen");

      function load() {
        CK.api.get("/api/appsettings").done(function (settings) {
          $("#loadingBox").hide();
          $("#settingsForm").removeClass("d-none");
          $("#mealVisibilityDays").val(settings.mealVisibilityDays);

          if (settings.updatedAt) {
            var note = "Last updated " + CK.fmt.dateTime(settings.updatedAt);
            if (settings.updatedByUserId) {
              CK.api.get("/api/users/" + settings.updatedByUserId).done(function (u) {
                $("#lastUpdatedNote").text(note + " by " + u.fullName + ".");
              }).fail(function () { $("#lastUpdatedNote").text(note + "."); });
            } else {
              $("#lastUpdatedNote").text(note + ".");
            }
          }
        }).fail(function (xhr) {
          $("#loadingBox").hide();
          CK.toast(CK.api.errorMessage(xhr, "Could not load app settings."), "danger");
        });
      }

      $("#settingsForm").on("submit", function (e) {
        e.preventDefault();
        $("#formAlert").addClass("d-none");
        var form = this;
        if (!form.checkValidity()) { $(form).addClass("was-validated"); return; }

        var payload = { mealVisibilityDays: parseInt($("#mealVisibilityDays").val(), 10), updatedByUserId: session.userId };
        var $btn = $("#saveBtn").prop("disabled", true).html('<span class="spinner-border spinner-border-sm me-1"></span>Saving&hellip;');

        CK.api.put("/api/appsettings", payload).done(function () {
          CK.toast("Settings saved.", "success");
          load();
        }).fail(function (xhr) {
          $("#formAlert").text(CK.api.errorMessage(xhr, "Could not save settings.")).removeClass("d-none");
        }).always(function () {
          $btn.prop("disabled", false).html('<i class="bi bi-check2 me-1"></i>Save Settings');
        });
      });

      load();
    });
  </script>
</body>
</html>
