<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Family Feedback - Faiz al-Mawaid al-Burhaniyah Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/site.css?v=20261007a" rel="stylesheet">
</head>
<body>
  <div id="ckNavbar"></div>

  <main class="container my-4">
    <div class="ck-page-header">
      <h1 class="mb-1"><i class="bi bi-chat-left-text-fill me-2"></i>Family Feedback</h1>
      <p class="ck-muted mb-0">Private messages between families and the Admin team. Only you and the family that sent it can see a response.</p>
    </div>

    <div class="d-flex align-items-center gap-2 mb-3">
      <label class="form-label mb-0" for="statusFilter">Show:</label>
      <select class="form-select" id="statusFilter" style="width:auto;">
        <option value="Open" selected>Waiting for a response</option>
        <option value="Responded">Already responded</option>
        <option value="">All</option>
      </select>
    </div>

    <div id="loadingBox" class="ck-loading"><div class="spinner-border text-primary"></div></div>
    <div id="emptyBox" class="ck-empty-state d-none"><i class="bi bi-chat-left-heart"></i>Nothing here.</div>
    <div id="cardsBox" class="d-flex flex-column gap-3"></div>
  </main>

  <!-- Respond modal -->
  <div class="modal fade" id="respondModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-reply-fill me-2"></i>Respond to Feedback</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <div class="ck-muted small">From</div>
            <div class="fw-semibold" id="rFamilyLabel">&mdash;</div>
          </div>
          <div class="mb-3">
            <div class="ck-muted small">Their message</div>
            <div id="rMessage" class="ck-small"></div>
          </div>
          <div id="respondAlert" class="alert alert-danger d-none"></div>
          <form id="respondForm" novalidate>
            <input type="hidden" id="rId">
            <div class="mb-2">
              <label class="form-label" for="rResponseText">Your response</label>
              <textarea class="form-control" id="rResponseText" rows="4" maxlength="1000" required></textarea>
              <div class="form-text text-end"><span id="rCharCount">0</span>/1000</div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="rSaveBtn"><i class="bi bi-check2 me-1"></i>Send Response</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="ck-footer text-center"><div class="container"><a href="https://www.thedawoodibohras.com/faiz-al-mawaid-al-burhaniyah/" target="_blank" rel="noopener" class="ck-footer-link">Faiz al-Mawaid al-Burhaniyah</a> Community Kitchen</div></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site.js?v=20261007a"></script>
  <script>
    $(function () {
      var session = CK.session.requireAdmin();
      if (!session) { return; }
      CK.nav.render("admin", "families");

      var usersById = {}, familiesById = {};
      var feedbackById = {};

      function familyLabel(familyId) {
        var family = familiesById[familyId];
        if (!family) { return "Family #" + familyId; }
        var user = usersById[family.familyHeadUserId] || {};
        var name = user.fullName || "(no name on file)";
        return name + (user.sabilNumber ? " &mdash; Sabil " + CK.esc(user.sabilNumber) : "");
      }

      function loadLookups(done) {
        $.when(
          CK.api.get("/api/families"),
          CK.api.get("/api/users?roleId=2")
        ).done(function (familiesResp, usersResp) {
          familiesById = {}; usersById = {};
          $.each(familiesResp[0] || [], function (i, f) { familiesById[f.id] = f; });
          $.each(usersResp[0] || [], function (i, u) { usersById[u.id] = u; });
          done();
        }).fail(function () { done(); });
      }

      function statusBadge(status) {
        return status === "Open"
          ? '<span class="badge badge-status-pending">Waiting</span>'
          : '<span class="badge badge-status-approved">Responded</span>';
      }

      function renderCards(items) {
        $("#loadingBox").hide();
        var $box = $("#cardsBox").empty();
        if (!items || items.length === 0) {
          $("#emptyBox").removeClass("d-none");
          return;
        }
        $("#emptyBox").addClass("d-none");
        $.each(items, function (i, fb) {
          feedbackById[fb.id] = fb;
          var card =
            '<div class="card">' +
              '<div class="card-body p-4">' +
                '<div class="d-flex justify-content-between align-items-start flex-wrap gap-2">' +
                  '<div>' +
                    '<div class="fw-semibold">' + familyLabel(fb.familyId) + '</div>' +
                    '<div class="ck-muted small">' + CK.fmt.dateTime(fb.createdAt) + '</div>' +
                  '</div>' +
                  statusBadge(fb.status) +
                '</div>' +
                '<p class="mt-3 mb-0">' + CK.esc(fb.message) + '</p>' +
                (fb.status === "Responded"
                  ? ('<hr><div class="ck-muted small mb-1"><i class="bi bi-reply-fill me-1"></i>Your response &mdash; ' + CK.fmt.dateTime(fb.respondedAt) + '</div>' +
                     '<p class="mb-2">' + CK.esc(fb.responseText) + '</p>' +
                     '<button class="btn btn-sm btn-outline-primary respond-btn" data-id="' + fb.id + '"><i class="bi bi-pencil me-1"></i>Edit Response</button>')
                  : ('<div class="mt-3"><button class="btn btn-sm btn-primary respond-btn" data-id="' + fb.id + '"><i class="bi bi-reply-fill me-1"></i>Respond</button></div>')) +
              '</div>' +
            '</div>';
          $box.append(card);
        });
      }

      function load() {
        $("#loadingBox").show();
        $("#emptyBox").addClass("d-none");
        $("#cardsBox").empty();
        var status = $("#statusFilter").val();
        var url = "/api/feedback" + (status ? ("?status=" + status) : "");
        loadLookups(function () {
          CK.api.get(url).done(function (items) {
            items = items || [];
            items.sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; });
            renderCards(items);
          }).fail(function (xhr) {
            $("#loadingBox").hide();
            CK.toast(CK.api.errorMessage(xhr, "Could not load feedback."), "danger");
          });
        });
      }

      $("#statusFilter").on("change", load);

      $(document).on("click", ".respond-btn", function () {
        var id = $(this).data("id");
        var fb = feedbackById[id];
        if (!fb) { return; }
        $("#respondAlert").addClass("d-none");
        $("#rId").val(fb.id);
        $("#rFamilyLabel").html(familyLabel(fb.familyId));
        $("#rMessage").text(fb.message);
        $("#rResponseText").val(fb.responseText || "");
        $("#rCharCount").text(($("#rResponseText").val() || "").length);
        new bootstrap.Modal(document.getElementById("respondModal")).show();
      });

      $("#rResponseText").on("input", function () {
        $("#rCharCount").text($(this).val().length);
      });

      $("#rSaveBtn").on("click", function () {
        $("#respondAlert").addClass("d-none");
        var id = $("#rId").val();
        var text = $("#rResponseText").val().trim();
        if (!text) {
          $("#respondAlert").text("Please enter a response.").removeClass("d-none");
          return;
        }
        var payload = { responseText: text, respondedByAdminUserId: session.userId };
        var $btn = $(this).prop("disabled", true).html('<span class="spinner-border spinner-border-sm me-1"></span>Sending&hellip;');

        CK.api.put("/api/feedback/" + id + "/respond", payload).done(function () {
          CK.toast("Response sent.", "success");
          bootstrap.Modal.getInstance(document.getElementById("respondModal")).hide();
          load();
        }).fail(function (xhr) {
          $("#respondAlert").text(CK.api.errorMessage(xhr, "Could not send this response.")).removeClass("d-none");
        }).always(function () {
          $btn.prop("disabled", false).html('<i class="bi bi-check2 me-1"></i>Send Response');
        });
      });

      load();
    });
  </script>
</body>
</html>
