<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Pending Registrations - Faiz al-Mawaid al-Burhaniyah Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/site.css?v=20260927b" rel="stylesheet">
</head>
<body>
  <div id="ckNavbar"></div>

  <main class="container my-4">
    <div class="ck-page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <h1 class="mb-1"><i class="bi bi-person-check-fill me-2"></i>Pending Registrations</h1>
        <p class="ck-muted mb-0">New families waiting for your approval.</p>
      </div>
      <a href="families.html" class="btn btn-outline-primary"><i class="bi bi-people me-1"></i>All Families</a>
    </div>

    <div id="loadingBox" class="ck-loading"><div class="spinner-border text-primary"></div></div>
    <div id="emptyBox" class="ck-empty-state d-none">
      <i class="bi bi-check2-circle"></i>
      No pending registrations right now. All caught up!
    </div>
    <div class="row g-3" id="cardsBox"></div>
  </main>

  <!-- Reject modal -->
  <div class="modal fade" id="rejectModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-x-circle me-2"></i>Reject Registration</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="rejectAlert" class="alert alert-danger d-none"></div>
          <p>Reject the registration for <strong id="rejectFamilyName"></strong>?</p>
          <label class="form-label" for="rejectReason">Reason <span class="ck-muted fw-normal">(optional, shown in the audit log)</span></label>
          <input type="text" class="form-control" id="rejectReason" maxlength="255">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmRejectBtn"><i class="bi bi-x-circle me-1"></i>Reject</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="ck-footer text-center">
    <div class="container"><a href="https://www.thedawoodibohras.com/faiz-al-mawaid-al-burhaniyah/" target="_blank" rel="noopener" class="ck-footer-link">Faiz al-Mawaid al-Burhaniyah</a> Community Kitchen</div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site.js?v=20260927b"></script>
  <script>
    $(function () {
      var session = CK.session.requireAdmin();
      if (!session) { return; }
      CK.nav.render("admin", "families");

      var usersById = {}, sizesById = {};
      var pendingRejectId = null;

      function load() {
        $("#loadingBox").show();
        $("#cardsBox").empty();
        $("#emptyBox").addClass("d-none");

        $.when(
          CK.api.get("/api/users?roleId=2"),
          CK.api.get("/api/thaalisizes"),
          CK.api.get("/api/families?status=Pending")
        ).done(function (usersResp, sizesResp, familiesResp) {
          usersById = {}; sizesById = {};
          $.each(usersResp[0] || [], function (i, u) { usersById[u.id] = u; });
          $.each(sizesResp[0] || [], function (i, s) { sizesById[s.id] = s; });
          render(familiesResp[0] || []);
        }).fail(function (xhr) {
          CK.toast(CK.api.errorMessage(xhr, "Could not load registrations."), "danger");
          $("#loadingBox").hide();
        });
      }

      function render(families) {
        $("#loadingBox").hide();
        var $box = $("#cardsBox").empty();
        if (families.length === 0) {
          $("#emptyBox").removeClass("d-none");
          return;
        }
        families.sort(function (a, b) { return a.createdAt < b.createdAt ? -1 : 1; });
        $.each(families, function (i, f) {
          var user = usersById[f.familyHeadUserId] || {};
          var size = sizesById[f.thaaliSizeId];
          var card =
            '<div class="col-md-6">' +
              '<div class="card h-100">' +
                '<div class="card-body p-4">' +
                  '<div class="d-flex justify-content-between align-items-start">' +
                    '<h5 class="mb-1">' + CK.esc(user.fullName || ("User #" + f.familyHeadUserId)) + '</h5>' +
                    '<span class="badge badge-status-pending">Pending</span>' +
                  '</div>' +
                  '<dl class="row mt-3 mb-3 ck-small">' +
                    '<dt class="col-4 ck-muted fw-normal">Sabil No.</dt><dd class="col-8">' + CK.esc(user.sabilNumber || "—") + '</dd>' +
                    '<dt class="col-4 ck-muted fw-normal">Email</dt><dd class="col-8">' + CK.esc(user.email || "—") + '</dd>' +
                    '<dt class="col-4 ck-muted fw-normal">Phone</dt><dd class="col-8">' + CK.esc(user.phone || "—") + '</dd>' +
                    '<dt class="col-4 ck-muted fw-normal">Address</dt><dd class="col-8">' + CK.esc(f.address || "—") + '</dd>' +
                    '<dt class="col-4 ck-muted fw-normal">Members</dt><dd class="col-8">' + CK.esc(f.numberOfMembers || "—") + '</dd>' +
                    '<dt class="col-4 ck-muted fw-normal">Thaali Size</dt><dd class="col-8">' + CK.esc(size ? size.name : ("#" + f.thaaliSizeId)) + '</dd>' +
                    '<dt class="col-4 ck-muted fw-normal">Applied</dt><dd class="col-8">' + CK.fmt.dateShort(f.createdAt) + '</dd>' +
                  '</dl>' +
                  '<div class="d-flex gap-2">' +
                    '<button class="btn btn-primary flex-fill approve-btn" data-id="' + f.id + '"><i class="bi bi-check2 me-1"></i>Approve</button>' +
                    '<button class="btn btn-outline-danger flex-fill reject-btn" data-id="' + f.id + '" data-name="' + CK.esc(user.fullName || "this family") + '"><i class="bi bi-x me-1"></i>Reject</button>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</div>';
          $box.append(card);
        });
      }

      $(document).on("click", ".approve-btn", function () {
        var id = $(this).data("id");
        var $btn = $(this).prop("disabled", true).html('<span class="spinner-border spinner-border-sm"></span>');
        CK.api.put("/api/families/" + id + "/approve", { approvedByAdminUserId: session.userId }).done(function () {
          CK.toast("Family approved.", "success");
          load();
        }).fail(function (xhr) {
          CK.toast(CK.api.errorMessage(xhr, "Could not approve this family."), "danger");
          $btn.prop("disabled", false).html('<i class="bi bi-check2 me-1"></i>Approve');
        });
      });

      $(document).on("click", ".reject-btn", function () {
        pendingRejectId = $(this).data("id");
        $("#rejectFamilyName").text($(this).data("name"));
        $("#rejectReason").val("");
        $("#rejectAlert").addClass("d-none");
        new bootstrap.Modal(document.getElementById("rejectModal")).show();
      });

      $("#confirmRejectBtn").on("click", function () {
        var $btn = $(this).prop("disabled", true).html('<span class="spinner-border spinner-border-sm"></span>');
        CK.api.put("/api/families/" + pendingRejectId + "/reject", {
          rejectedByAdminUserId: session.userId,
          reason: $("#rejectReason").val().trim() || null
        }).done(function () {
          $("#rejectModal").modal("hide");
          CK.toast("Registration rejected.", "success");
          load();
        }).fail(function (xhr) {
          $("#rejectAlert").text(CK.api.errorMessage(xhr, "Could not reject this family.")).removeClass("d-none");
        }).always(function () {
          $btn.prop("disabled", false).html('<i class="bi bi-x-circle me-1"></i>Reject');
        });
      });

      load();
    });
  </script>
</body>
</html>
