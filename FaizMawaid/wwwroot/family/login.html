<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Find My Family - Faiz al-Mawaid al-Burhaniyah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/site.css?v=20260927b" rel="stylesheet">
</head>
<body>
  <div id="ckNavbar"></div>

  <main class="container" style="max-width:520px;">
    <div class="ck-page-header text-center">
      <div class="ck-eyebrow">Family Head</div>
      <h1><i class="bi bi-house-heart-fill me-2"></i>My Thaali</h1>
      <p class="ck-muted">Sign in with the email and password you registered with.</p>
    </div>

    <div class="card ck-card-elevated mb-5">
      <div class="card-body p-4 p-md-5">
        <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-4">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control form-control-lg" id="email" required autofocus placeholder="you@example.com">
            <div class="invalid-feedback">Please enter your email address.</div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg" id="password" required placeholder="Your password">
            <div class="invalid-feedback">Please enter your password.</div>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </div>
        </form>

        <p class="text-center ck-muted mt-4 mb-0">
          Not registered yet? <a href="register.html">Register your family</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="ck-footer text-center">
    <div class="container"><a href="https://www.thedawoodibohras.com/faiz-al-mawaid-al-burhaniyah/" target="_blank" rel="noopener" class="ck-footer-link">Faiz al-Mawaid al-Burhaniyah</a> Community Kitchen</div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site.js?v=20260927b"></script>
  <script>
    $(function () {
      CK.nav.render("guest", null);

      function showAlert(message) {
        $("#formAlert").text(message).removeClass("d-none");
      }

      if (window.location.search.indexOf("expired=1") >= 0) {
        showAlert("Your session has expired. Please sign in again.");
      }

      // If already signed in, skip straight to the dashboard.
      var existing = CK.session.getFamily();
      if (existing && existing.familyId && existing.accessToken) {
        window.location.replace("dashboard.html");
        return;
      }

      $("#loginForm").on("submit", function (e) {
        e.preventDefault();
        e.stopPropagation();
        $("#formAlert").addClass("d-none");

        var form = this;
        if (!form.checkValidity()) {
          $(form).addClass("was-validated");
          return;
        }

        var email = $("#email").val().trim();
        var password = $("#password").val();
        var $btn = $("#submitBtn").prop("disabled", true).html('<span class="spinner-border spinner-border-sm me-1"></span> Signing in&hellip;');

        CK.auth.login(email, password).done(function (resp) {
          if (!resp.familyId) {
            showAlert("This account isn't set up as a Family Head. Please contact the Kitchen Admin.");
            resetBtn();
            return;
          }
          CK.session.setFamily(resp);
          window.location.href = "dashboard.html";
        }).fail(function (xhr) {
          showAlert(CK.api.errorMessage(xhr, "Could not sign you in."));
          resetBtn();
        });

        function resetBtn() {
          $btn.prop("disabled", false).html('<i class="bi bi-box-arrow-in-right me-1"></i> Sign In');
        }
      });
    });
  </script>
</body>
</html>
